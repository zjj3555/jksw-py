name: build-juku-nro
on:
  push:
    branches: [ main ]
  workflow_dispatch:        # 也可在 Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 devkitPro 工具链
        run: |
          wget -q https://github.com/devkitPro/setup-business-devkitpro/raw/master/install-devkitpro-pacman
          chmod +x install-devkitpro-pacman
          sudo ./install-devkitpro-pacman
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/devkitpro-pacman/bin" >> "$GITHUB_PATH"

      - name: 安装依赖库 (libnx + libmpv + libcurl)
        run: |
          dkp-pacman -S --noconfirm switch-dev switch-libnx switch-libmpv switch-libcurl

      - name: 编译 juku.nro
        run: |
          make

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: juku-nro
          path: juku.nro
name: build-juku-nro
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖库 (libmpv + libcurl, libnx 已含在 switch-dev)
        run: |
          dkp-pacman -S --noconfirm switch-dev switch-libmpv switch-libcurl

      - name: 编译 juku.nro
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          make

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: juku-nro
          path: juku.nro

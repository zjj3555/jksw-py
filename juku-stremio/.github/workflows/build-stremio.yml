name: build-juku-stremio

# 这个 workflow 永远只把 example_list.json 部署到 GitHub Pages。
# 你的真实 juku 源不要提交到这里（保持本地）—— 本地 build 后手动把
# 生成的 catalog/ + stream/ 文件推上来即可（见 juku-stremio/local-build.md）。
on:
  push:
    branches: [main]
    paths:
      - 'juku-stremio/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build static plugin (example only)
        run: |
          cd juku-stremio
          # 强制只用 example_list.json，保证不会把私人源推到 Pages
          python build.py --in example_list.json --out .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: juku-stremio

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
